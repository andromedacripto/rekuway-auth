services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rekuway_auth
      POSTGRES_USER: rekuway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rekuway}
    ports:
      - "5432:5432"
    volumes:
      - rekuway_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekuway -d rekuway_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-rekuway}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rekuway}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rekuway_postgres_data:
