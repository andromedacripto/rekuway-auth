name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rekuway_auth_test
          POSTGRES_USER: rekuway
          POSTGRES_PASSWORD: rekuway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rekuway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://rekuway:rekuway@localhost:5432/rekuway_auth_test
      REDIS_URL: redis://localhost:6379
      RP_ID: localhost
      RP_NAME: Rekuway Auth
      ORIGIN: http://localhost:3000
      SESSION_SECRET: ci-test-secret-not-a-real-secret-please
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma generate + migrate
        run: |
          pnpm --filter @rekuway/api exec prisma generate
          pnpm --filter @rekuway/api exec prisma migrate deploy

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
