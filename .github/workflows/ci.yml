name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rekuway_auth_test
          POSTGRES_USER: rekuway
          POSTGRES_PASSWORD: rekuway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rekuway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://rekuway:rekuway@localhost:5432/rekuway_auth_test
      REDIS_URL: redis://localhost:6379
      RP_ID: localhost
      RP_NAME: Rekuway Auth
      ORIGIN: http://localhost:3000
      SESSION_SECRET: ci-test-secret-not-a-real-secret-please
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma generate must run BEFORE lint/typecheck: without real
      # generated types, @prisma/client falls back to an untyped stub and
      # every Prisma call in the codebase becomes `any`, which cascades into
      # dozens of spurious @typescript-eslint/no-unsafe-* errors that have
      # nothing to do with real code issues.
      - name: Prisma generate + migrate
        run: |
          pnpm --filter @rekuway/api exec prisma generate
          pnpm --filter @rekuway/api exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dependency audit
        # Advisory, not a hard gate: many findings live deep in the Expo
        # mobile scaffold's build tooling (not runtime-facing production
        # code) and would otherwise block every PR on transitive-dependency
        # CVEs the team has no direct control over. Results still print in
        # full in the CI log for review.
        run: pnpm audit --audit-level=high || true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
